<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>API Client</title>
    <link rel="stylesheet" href="api.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <div>
        <span class="eyebrow">SESSION HTTP CLIENT</span>
        <h1>APIリクエスト</h1>
      </div>
      <span id="session" class="session-pill"></span>
    </header>
    <section class="request-card">
      <div class="name-row">
        <input
          id="name"
          aria-label="リクエスト名"
          maxlength="80"
          placeholder="リクエスト名（保存する場合に入力）"
        /><button id="save">保存</button>
      </div>
      <form id="request-form">
        <div class="request-line">
          <select id="method" aria-label="HTTPメソッド">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>PATCH</option>
            <option>DELETE</option>
            <option>HEAD</option>
            <option>OPTIONS</option></select
          ><input
            id="url"
            aria-label="APIのURL"
            placeholder="https://example.com/api/me"
            autocomplete="off"
            spellcheck="false"
          /><button id="send" class="primary" type="submit">送信 ↗</button
          ><button type="button" id="cancel" hidden>中止</button>
        </div>
      </form>
      <p id="error" role="alert" hidden></p>
      <nav class="editor-tabs" aria-label="リクエストの設定">
        <button data-panel="params" class="selected">クエリ</button
        ><button data-panel="headers">ヘッダー</button
        ><button data-panel="body">本文</button
        ><button data-panel="auth">認証</button>
      </nav>
      <div class="editor-panel" id="panel-params">
        <label for="params">クエリパラメーター</label>
        <p class="help">1行に key=value。値は自動でURLエンコードします。</p>
        <textarea
          id="params"
          aria-label="クエリパラメーター"
          placeholder="limit=20&#10;keyword=テスト"
          spellcheck="false"
        ></textarea>
      </div>
      <div class="editor-panel" id="panel-headers" hidden>
        <label for="headers">カスタムヘッダー</label>
        <p class="help">
          1行に Name: value。CookieとAuthorizationは認証欄で設定します。
        </p>
        <textarea
          id="headers"
          aria-label="カスタムヘッダー"
          placeholder="Accept: application/json&#10;X-CSRF-Token: ..."
          spellcheck="false"
        ></textarea>
      </div>
      <div class="editor-panel" id="panel-body" hidden>
        <div class="body-tools">
          <select id="bodyType" aria-label="本文形式">
            <option value="json">JSON</option>
            <option value="text">テキスト</option>
            <option value="none">本文なし</option></select
          ><button id="format">JSONを整形</button>
        </div>
        <p class="help" id="body-help">GET / HEADでは本文を送信しません。</p>
        <textarea
          id="body"
          aria-label="リクエスト本文"
          placeholder='{"message": "テスト"}'
          spellcheck="false"
        ></textarea>
      </div>
      <div class="editor-panel" id="panel-auth" hidden>
        <label for="auth">認証方法</label
        ><select id="auth" aria-label="認証方法">
          <option value="session">ブラウザのCookieを使用</option>
          <option value="none">認証なし（Cookieを送信しない）</option>
          <option value="bearer">Bearer（Cookieを送信しない）</option>
        </select>
        <p id="auth-help" class="help"></p>
        <div id="bearer-row" hidden>
          <label for="bearer">Bearerトークン</label
          ><input
            id="bearer"
            aria-label="Bearerトークン"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="トークンの値のみ"
          />
        </div>
        <label for="timeout">タイムアウト（秒）</label
        ><input
          id="timeout"
          aria-label="タイムアウト（秒）"
          type="number"
          min="1"
          max="120"
          value="30"
        />
      </div>
      <div class="request-footer">
        <span
          >保存にはURL・本文を含みます。Bearerと認証系ヘッダーは保存・複製に含めません。</span
        >
        <div>
          <select id="duplicate-session" aria-label="複製先セッション"></select
          ><button id="duplicate">別タブへ複製</button>
        </div>
      </div>
    </section>
    <section class="library-card">
      <div>
        <label for="saved">保存したリクエスト</label>
        <div class="library-row">
          <select id="saved" aria-label="保存したリクエスト">
            <option value="">選択してください</option></select
          ><button id="load-saved">開く</button
          ><button id="delete-saved" class="subtle">削除</button>
        </div>
      </div>
      <div>
        <label for="history">このタブの実行履歴</label>
        <div class="library-row">
          <select id="history" aria-label="実行履歴">
            <option value="">履歴はありません</option></select
          ><button id="load-history">復元</button>
        </div>
      </div>
    </section>
    <section class="response-card">
      <div class="response-heading">
        <div>
          <span class="eyebrow">RESPONSE</span>
          <div id="result-meta" role="status">まだ送信していません</div>
        </div>
        <button id="copy-response" disabled>本文をコピー</button>
      </div>
      <p id="response-url" class="response-url" hidden></p>
      <p id="response-note" class="help" hidden></p>
      <nav class="editor-tabs">
        <button data-response="pretty" class="selected">整形</button
        ><button data-response="raw">Raw</button
        ><button data-response="headers">ヘッダー</button>
      </nav>
      <pre id="response" tabindex="0">ここにレスポンスが表示されます。</pre>
    </section>
  </body>
</html>
