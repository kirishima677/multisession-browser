<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>ページ内検索</title>
    <link rel="stylesheet" href="find.css" />
    <script src="find.js" defer></script>
  </head>
  <body>
    <form id="find-form">
      <input
        id="query"
        aria-label="ページ内検索"
        placeholder="検索する文字列"
        maxlength="2048"
        autocomplete="off"
        autofocus
      /><button type="button" id="previous" aria-label="前の一致">↑</button
      ><button type="submit" aria-label="次の一致">↓</button
      ><button type="button" id="close" aria-label="検索を閉じる">×</button>
    </form>
    <div class="status">
      <span id="matches" role="status">検索語を入力してください</span
      ><span>Enter：次へ · ⇧Enter：前へ · Esc：閉じる</span>
    </div>
  </body>
</html>
